name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: echo "Installing dependencies..."

      - name: Lint
        run: echo "Linting... OK"

      - name: Build
        run: echo "Building project... OK"

      - name: Test
        run: echo "Running tests... 42 passed, 0 failed"

      - name: Test (always fail)
        run: exit 1

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() }}
    steps:
      - run: |
          if [ "${{ needs.build.result }}" = "failure" ] || [ "${{ needs.build.result }}" = "cancelled" ]; then
            echo "Build failed or was cancelled."
            exit 1
          else
            echo "Build passed."
            exit 0
          fi